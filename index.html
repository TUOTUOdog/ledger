<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>随手记</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f3f5; --card:#fff; --txt:#14161a; --sub:#8a9099; --line:#e8eaed;
  --accent:#4f46e5; --exp:#14161a; --inc:#0a9d63; --danger:#e5484d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
main{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
.view{display:none;padding:14px 14px 0}
.view.on{display:block}
.hd{padding:18px 16px 6px}
.hd h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.3px}
.hd p{margin:2px 0 0;font-size:12.5px;color:var(--sub)}

/* segmented */
.seg{display:flex;background:#e6e8ec;border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:9px;font-size:14.5px;color:#5a616b;font-family:inherit;transition:.15s}
.seg button.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* amount */
.amt{background:var(--card);border-radius:16px;padding:16px 18px;display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.amt .cny{font-size:24px;color:var(--sub);font-weight:500}
.amt input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  font-size:38px;font-weight:600;font-family:inherit;color:var(--txt);
  letter-spacing:-.5px;padding:0;
}
.amt input::placeholder{color:#c7cbd1}

/* category grid */
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card>label,.lbl{display:block;font-size:12.5px;color:var(--sub);margin:0 0 9px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cats button{
  border:0;background:#f4f5f7;border-radius:11px;padding:9px 2px 8px;
  font-family:inherit;font-size:11.5px;color:#5a616b;display:flex;flex-direction:column;
  align-items:center;gap:3px;transition:.12s;
}
.cats button .e{font-size:18px;line-height:1.1}
.cats button.on{background:#eeeefe;color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--accent)}

/* fields */
.f{margin-bottom:12px}
.f label{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.f input{
  width:100%;border:0;outline:0;background:var(--card);border-radius:12px;
  padding:12px 14px;font-size:15px;font-family:inherit;color:var(--txt);
}
.f input::placeholder{color:#c2c7ce}
.f input:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.hint{color:var(--accent);font-size:11.5px}
.hint.off{color:transparent}

/* primary btn */
.primary{
  width:100%;border:0;border-radius:13px;padding:14px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:600;font-family:inherit;margin:4px 0 18px;
}
.primary:active{opacity:.85}

/* list */
.mbar{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0 12px}
.mbar div{font-size:15.5px;font-weight:600;min-width:106px;text-align:center}
.mbar button{border:0;background:transparent;font-size:22px;color:var(--sub);padding:0 10px;font-family:inherit}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{
  border:0;background:#e6e8ec;color:#5a616b;font-family:inherit;font-size:12.5px;
  padding:6px 14px;border-radius:999px;
}
.chips button.on{background:var(--txt);color:#fff}
.sumline{display:flex;gap:16px;font-size:12.5px;color:var(--sub);padding:0 4px 10px}
.sumline b{color:var(--txt);font-weight:600}
.day{margin-bottom:14px}
.dayhd{display:flex;justify-content:space-between;padding:0 4px 6px;font-size:12px;color:var(--sub)}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:#fafafb}
.row .ico{width:34px;height:34px;border-radius:10px;background:#f4f5f7;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.row .mid{flex:1;min-width:0}
.row .t1{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.v.exp{color:var(--exp)}
.v.inc{color:var(--inc)}
.nonote{color:#d97706}

/* stat */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stats div{background:var(--card);border-radius:14px;padding:13px 10px;text-align:center}
.stats span{display:block;font-size:11.5px;color:var(--sub);margin-bottom:3px}
.stats b{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.bar{margin-bottom:11px}
.barhd{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.barhd span:last-child{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px}
.track{height:7px;background:#eef0f3;border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:46px 20px}
.empty .big{font-size:34px;display:block;margin-bottom:10px}

/* more */
.mrow{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line);font-size:14.5px}
.mrow:last-child{border-bottom:0}
.mrow small{color:var(--sub);font-size:12px;margin-left:6px}
.mrow button{border:0;background:#f4f5f7;border-radius:9px;padding:6px 13px;font-family:inherit;font-size:13px;color:var(--txt)}
.mrow button.danger{color:var(--danger)}
.tip{font-size:12px;color:var(--sub);padding:12px 4px;line-height:1.7}

/* nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  max-width:560px;margin:0 auto;
}
nav button{
  flex:1;border:0;background:transparent;font-family:inherit;padding:9px 0 10px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sub);
}
nav button .e{font-size:19px;line-height:1.2;filter:grayscale(1);opacity:.55}
nav button.on{color:var(--accent);font-weight:600}
nav button.on .e{filter:none;opacity:1}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:30;display:none}
.mask.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:-100%;z-index:31;background:#fff;
  border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;transition:bottom .22s ease;max-height:88vh;overflow:auto;
}
.sheet.on{bottom:0}
.sheet h3{margin:0 0 14px;font-size:16px;font-weight:650}

/* toast */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
  background:rgba(20,22,26,.9);color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;transition:.2s;pointer-events:none;z-index:50;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <div class="hd">
    <h1>随手记</h1>
    <p id="hdSub">在手机上记下每一笔，自动归好类</p>
  </div>

  <main>
    <!-- 记一笔 -->
    <section class="view on" id="v-add">
      <div class="seg" id="typeSeg">
        <button data-t="expense" class="on">支出</button>
        <button data-t="income">收入</button>
      </div>

      <div class="amt">
        <span class="cny">¥</span>
        <input id="amt" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </div>

      <div class="card">
        <label>分类</label>
        <div class="cats" id="cats"></div>
      </div>

      <div class="f">
        <label>商户 / 项目</label>
        <input id="merchant" list="mhist" placeholder="比如 瑞幸咖啡" autocomplete="off">
        <datalist id="mhist"></datalist>
      </div>

      <div class="f">
        <label>备注 <span class="hint off" id="catHint">已自动归类</span></label>
        <input id="note" placeholder="这笔钱花在哪儿了？">
      </div>

      <div class="f">
        <label>时间</label>
        <input id="time" type="datetime-local">
      </div>

      <button class="primary" id="saveBtn">保存</button>
    </section>

    <!-- 明细 -->
    <section class="view" id="v-list">
      <div class="mbar">
        <button id="prevM">‹</button>
        <div id="mLabel">—</div>
        <button id="nextM">›</button>
      </div>
      <div class="chips" id="filters">
        <button data-f="all" class="on">全部</button>
        <button data-f="nonote">待补备注</button>
      </div>
      <div class="sumline" id="listSum"></div>
      <div id="listBody"></div>
    </section>

    <!-- 统计 -->
    <section class="view" id="v-stat">
      <div class="stats" id="statCards"></div>
      <div class="card">
        <label>支出分类排行</label>
        <div id="statBars"></div>
      </div>
      <div class="tip" id="statTip"></div>
    </section>

    <!-- 更多 -->
    <section class="view" id="v-more">
      <div class="card" style="padding:0">
        <div class="mrow"><span>导出备份 <small>JSON，含全部数据</small></span><button id="expJson">导出</button></div>
        <div class="mrow"><span>导出表格 <small>CSV，可用 Excel 打开</small></span><button id="expCsv">导出</button></div>
        <div class="mrow"><span>从备份恢复 <small>合并导入，不会重复</small></span><button id="impBtn">选择文件</button></div>
        <input type="file" id="impFile" accept=".json,application/json" style="display:none">
        <div class="mrow"><span>清空所有数据</span><button class="danger" id="clearBtn">清空</button></div>
      </div>
      <div class="card" style="padding:0">
        <div class="mrow"><span>已记笔数</span><b id="cntEntries">0</b></div>
        <div class="mrow"><span>学会的商户规则</span><b id="cntRules">0</b></div>
        <div class="mrow"><span>清除商户记忆</span><button class="danger" id="clearRules">清除</button></div>
      </div>
      <div class="tip">
        数据只存在这台手机的浏览器里，不上传任何服务器。<br>
        换手机、清缓存前，记得先「导出备份」。
      </div>
    </section>
  </main>

  <nav>
    <button data-v="add" class="on"><span class="e">✏️</span>记一笔</button>
    <button data-v="list"><span class="e">📋</span>明细</button>
    <button data-v="stat"><span class="e">📊</span>统计</button>
    <button data-v="more"><span class="e">⚙️</span>更多</button>
  </nav>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ============ 基础数据 ============ */
const EXP_CATS = [
  {k:'餐饮', e:'🍜'}, {k:'交通', e:'🚇'}, {k:'购物', e:'🛍️'}, {k:'日用', e:'🧴'}, {k:'娱乐', e:'🎬'},
  {k:'居住', e:'🏠'}, {k:'医疗', e:'💊'}, {k:'教育', e:'📚'}, {k:'人情', e:'🎁'}, {k:'其他', e:'📦'}
];
const INC_CATS = [
  {k:'工资', e:'💰'}, {k:'兼职', e:'💼'}, {k:'理财', e:'📈'}, {k:'红包', e:'🧧'}, {k:'其他', e:'📦'}
];
const CATS = {expense: EXP_CATS, income: INC_CATS};

// 内置商户关键词规则（只对支出生效）
const RULES = [
  {cat:'餐饮', kw:['星巴克','瑞幸','库迪','麦当劳','肯德基','汉堡王','必胜客','海底捞','西贝','老乡鸡','沙县','美团','饿了么','外卖','餐厅','饭店','火锅','烧烤','咖啡','奶茶','喜茶','蜜雪','奈雪','茶百道','古茗','面馆','食堂','早点','早餐','烧烤','小吃','便利店快餐']},
  {cat:'交通', kw:['滴滴','高德','曹操','t3','打车','出租车','地铁','公交','12306','高铁','火车','机票','航空','航班','加油','中石化','中石油','停车','共享单车','哈啰','青桔','美团单车','过路费','高速']},
  {cat:'购物', kw:['淘宝','天猫','京东','拼多多','唯品会','抖音商城','商场','优衣库','耐克','阿迪','小米','苹果','华为','苏宁','得物','闲鱼','淘宝']},
  {cat:'日用', kw:['超市','盒马','永辉','沃尔玛','大润发','全家','7-11','711','罗森','便利蜂','日用品','洗发','纸巾','洗衣','牙膏','理发']},
  {cat:'娱乐', kw:['电影','影院','万达','游戏','steam','网易云','qq音乐','腾讯视频','爱奇艺','优酷','哔哩','b站','ktv','演唱会','门票','健身','体育馆','剧本杀','密室']},
  {cat:'居住', kw:['房租','物业','水费','电费','燃气','宽带','网费','取暖','家政','维修']},
  {cat:'医疗', kw:['医院','药房','药店','诊所','挂号','体检','牙科','口腔','门诊','医保']},
  {cat:'教育', kw:['学费','书店','图书','当当','课程','培训','考试','文具','网课','学校']},
  {cat:'人情', kw:['红包','礼金','礼物','份子','请客','随礼','鲜花']}
];

/* ============ 状态 ============ */
const K_DATA = 'ledger.v1';
const K_RULE = 'ledger.rules.v1';

let entries = [];
let learned = {};
let month = ymNow();
let filter = 'all';
let curType = 'expense';
let curCat = '其他';
let manualCat = false;
let editId = null;

function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function ymNow(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function ymShift(m, delta){
  const p = m.split('-');
  const d = new Date(Number(p[0]), Number(p[1])-1+delta, 1);
  return d.getFullYear()+'-'+pad(d.getMonth()+1);
}
function fmt(cents){
  const v = Math.abs(cents)/100;
  const s = v.toFixed(2);
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}
function dayKey(iso){
  const d = new Date(iso);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
// 按本地时间取年月，避免 UTC 偏移把月初的账算到上个月
function monthKey(iso){
  const d = new Date(iso);
  return d.getFullYear()+'-'+pad(d.getMonth()+1);
}
function dayLabel(key){
  const t = new Date();
  const today = t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  t.setDate(t.getDate()-1);
  const yest = t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  if(key===today) return '今天';
  if(key===yest) return '昨天';
  const p = key.split('-');
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getDay()];
  return Number(p[1])+'月'+Number(p[2])+'日 '+wd;
}
function fmtTime(iso){
  const d = new Date(iso);
  return pad(d.getHours())+':'+pad(d.getMinutes());
}

/* ============ 存取 ============ */
function load(){
  try{ entries = JSON.parse(localStorage.getItem(K_DATA) || '[]'); }catch(e){ entries = []; }
  if(!Array.isArray(entries)) entries = [];
  entries = entries.filter(function(e){ return e && e.id && typeof e.amt === 'number'; });
  try{ learned = JSON.parse(localStorage.getItem(K_RULE) || '{}'); }catch(e){ learned = {}; }
  if(!learned || typeof learned !== 'object' || Array.isArray(learned)) learned = {};
}
function saveData(){
  try{ localStorage.setItem(K_DATA, JSON.stringify(entries)); }
  catch(e){ toast('空间不足，请先导出备份'); }
}
function saveRules(){
  try{ localStorage.setItem(K_RULE, JSON.stringify(learned)); }catch(e){}
}

/* ============ 提示 ============ */
let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1700);
}

/* ============ 自动归类 ============ */
function recommend(merchant){
  const k = String(merchant || '').trim().toLowerCase();
  if(!k) return null;
  if(learned[k]) return learned[k];
  for(let i=0;i<RULES.length;i++){
    const r = RULES[i];
    for(let j=0;j<r.kw.length;j++){
      if(k.indexOf(r.kw[j].toLowerCase()) !== -1) return r.cat;
    }
  }
  return null;
}

/* ============ 视图切换 ============ */
function switchView(v){
  $$('.view').forEach(function(s){ s.classList.remove('on'); });
  $('#v-'+v).classList.add('on');
  $$('nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
  window.scrollTo(0,0);
  if(v === 'list') renderList();
  if(v === 'stat') renderStat();
  if(v === 'more') renderMore();
}

/* ============ 记一笔 ============ */
function renderCats(){
  const list = CATS[curType];
  $('#cats').innerHTML = list.map(function(c){
    return '<button data-c="'+c.k+'" class="'+(c.k===curCat?'on':'')+'"><span class="e">'+c.e+'</span>'+c.k+'</button>';
  }).join('');
}
function setCat(k){
  curCat = k;
  $$('#cats button').forEach(function(b){ b.classList.toggle('on', b.dataset.c === k); });
}
function setHint(text){
  const h = $('#catHint');
  if(text){ h.textContent = text; h.classList.remove('off'); }
  else { h.classList.add('off'); }
}
function recommendApply(){
  if(manualCat) return;
  const m = $('#merchant').value;
  const c = recommend(m);
  if(c && CATS[curType].some(function(x){ return x.k === c; })){
    setCat(c);
    setHint('已按「'+m.trim()+'」自动归为 '+c);
  } else {
    setHint('');
  }
}
function resetAdd(){
  $('#amt').value = '';
  $('#merchant').value = '';
  $('#note').value = '';
  $('#time').value = localNowValue();
  curCat = '其他'; manualCat = false;
  setCat('其他'); setHint('');
  refreshMerchantHistory();
}
function localNowValue(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function parseAmount(s){
  s = String(s||'').replace(/[^\d.]/g,'');
  if(!s) return 0;
  const f = parseFloat(s);
  if(!isFinite(f) || f <= 0) return 0;
  return Math.round(f * 100);
}
function refreshMerchantHistory(){
  const seen = {};
  const names = [];
  entries.forEach(function(e){
    if(e.merchant && !seen[e.merchant]){ seen[e.merchant] = 1; names.push(e.merchant); }
  });
  names.sort();
  $('#mhist').innerHTML = names.slice(0,60).map(function(n){
    return '<option value="'+n.replace(/"/g,'&quot;')+'">';
  }).join('');
}
function saveEntry(){
  const cents = parseAmount($('#amt').value);
  if(!cents){ toast('先填一个金额'); $('#amt').focus(); return; }
  const tval = $('#time').value;
  const when = tval ? new Date(tval) : new Date();
  if(isNaN(when.getTime())){ toast('时间格式不对'); return; }

  const e = {
    id: uid(),
    type: curType,
    amt: cents,
    cat: curCat,
    merchant: $('#merchant').value.trim(),
    note: $('#note').value.trim(),
    time: when.toISOString()
  };
  entries.unshift(e);

  // 学习：支出 + 有商户 + 明确分类
  const k = e.merchant.toLowerCase();
  if(e.type === 'expense' && k && e.cat !== '其他' && learned[k] !== e.cat){
    learned[k] = e.cat;
    saveRules();
  }
  saveData();
  toast(e.note ? '记好了' : '记好了，记得补备注');
  resetAdd();
  $('#amt').focus();
}

/* ============ 明细 ============ */
function monthEntries(){
  return entries.filter(function(e){ return monthKey(e.time) === month; })
    .sort(function(a,b){ return a.time < b.time ? 1 : -1; });
}
function renderList(){
  const p = month.split('-');
  $('#mLabel').textContent = p[0]+'年'+Number(p[1])+'月';

  let list = monthEntries();
  if(filter === 'nonote') list = list.filter(function(e){ return !e.note; });

  let exp = 0, inc = 0;
  monthEntries().forEach(function(e){
    if(e.type === 'expense') exp += e.amt; else inc += e.amt;
  });
  $('#listSum').innerHTML = '支出 <b>¥'+fmt(exp)+'</b>　收入 <b>¥'+fmt(inc)+'</b>　共 '+monthEntries().length+' 笔';

  if(!list.length){
    $('#listBody').innerHTML = '<div class="empty"><span class="big">🗒️</span>'+
      (filter==='nonote' ? '这个月没有待补备注的账' : '这个月还没有记账')+'</div>';
    return;
  }

  const groups = {};
  list.forEach(function(e){
    const k = dayKey(e.time);
    (groups[k] = groups[k] || []).push(e);
  });

  const keys = Object.keys(groups).sort().reverse();
  let html = '';
  keys.forEach(function(k){
    const arr = groups[k];
    let dsum = 0;
    arr.forEach(function(e){ if(e.type === 'expense') dsum += e.amt; });
    html += '<div class="day"><div class="dayhd"><span>'+dayLabel(k)+'</span><span>支出 ¥'+fmt(dsum)+'</span></div><div class="list">';
    arr.forEach(function(e){
      const cat = CATS[e.type].filter(function(c){ return c.k === e.cat; })[0];
      const icon = cat ? cat.e : '📦';
      const title = e.merchant || e.note || e.cat;
      const sub = esc(e.cat) + ' · ' + (e.note ? esc(e.note) : '<span class="nonote">待补备注</span>');
      html += '<div class="row" data-id="'+e.id+'">'+
        '<div class="ico">'+icon+'</div>'+
        '<div class="mid"><div class="t1">'+esc(title)+'</div><div class="t2">'+sub+'</div></div>'+
        '<div class="v '+(e.type==='expense'?'exp':'inc')+'">'+(e.type==='expense'?'-':'+')+fmt(e.amt)+'</div>'+
      '</div>';
    });
    html += '</div></div>';
  });
  $('#listBody').innerHTML = html;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============ 编辑弹层 ============ */
function openEdit(id){
  const e = entries.filter(function(x){ return x.id === id; })[0];
  if(!e) return;
  editId = id;
  const cats = CATS[e.type];
  const d = new Date(e.time);
  const tv = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());

  $('#sheet').innerHTML =
    '<h3>编辑这一笔</h3>'+
    '<div class="f"><label>金额</label><input id="e_amt" inputmode="decimal" value="'+(e.amt/100).toFixed(2)+'"></div>'+
    '<div class="f"><label>分类</label><div class="cats" id="e_cats">'+
      cats.map(function(c){ return '<button data-c="'+c.k+'" class="'+(c.k===e.cat?'on':'')+'"><span class="e">'+c.e+'</span>'+c.k+'</button>'; }).join('')+
    '</div></div>'+
    '<div class="f"><label>商户 / 项目</label><input id="e_mer" value="'+esc(e.merchant)+'"></div>'+
    '<div class="f"><label>备注</label><input id="e_note" value="'+esc(e.note)+'"></div>'+
    '<div class="f"><label>时间</label><input id="e_time" type="datetime-local" value="'+tv+'"></div>'+
    '<button class="primary" id="e_save">保存修改</button>'+
    '<button class="primary" id="e_del" style="background:#fdecec;color:var(--danger);margin-top:0">删除这笔</button>';

  $('#mask').classList.add('on');
  $('#sheet').classList.add('on');

  let ecat = e.cat;
  $$('#e_cats button').forEach(function(b){
    b.onclick = function(){ ecat = b.dataset.c; $$('#e_cats button').forEach(function(x){ x.classList.toggle('on', x===b); }); };
  });
  $('#e_save').onclick = function(){
    const cents = parseAmount($('#e_amt').value);
    if(!cents){ toast('金额不对'); return; }
    const w = new Date($('#e_time').value);
    e.amt = cents; e.cat = ecat;
    e.merchant = $('#e_mer').value.trim();
    e.note = $('#e_note').value.trim();
    if(!isNaN(w.getTime())) e.time = w.toISOString();
    const k = e.merchant.toLowerCase();
    if(k && e.cat !== '其他'){ learned[k] = e.cat; saveRules(); }
    saveData(); closeSheet(); renderList(); toast('已保存');
  };
  $('#e_del').onclick = function(){
    if(!confirm('确定删除这一笔？')) return;
    entries = entries.filter(function(x){ return x.id !== id; });
    saveData(); closeSheet(); renderList(); toast('已删除');
  };
}
function closeSheet(){
  $('#mask').classList.remove('on');
  $('#sheet').classList.remove('on');
  editId = null;
}

/* ============ 统计 ============ */
function renderStat(){
  const list = monthEntries();
  let exp = 0, inc = 0, noNote = 0;
  const byCat = {};
  list.forEach(function(e){
    if(e.type === 'expense'){
      exp += e.amt;
      byCat[e.cat] = (byCat[e.cat]||0) + e.amt;
      if(!e.note) noNote++;
    } else inc += e.amt;
  });
  const p = month.split('-');
  const bal = inc - exp;
  $('#statCards').innerHTML =
    '<div><span>支出</span><b>¥'+fmt(exp)+'</b></div>'+
    '<div><span>收入</span><b style="color:var(--inc)">¥'+fmt(inc)+'</b></div>'+
    '<div><span>结余</span><b style="color:'+(bal<0?'var(--danger)':'var(--txt)')+'">¥'+fmt(bal)+'</b></div>';

  const arr = Object.keys(byCat).map(function(k){ return {k:k, v:byCat[k]}; })
    .sort(function(a,b){ return b.v - a.v; });

  if(!arr.length){
    $('#statBars').innerHTML = '<div class="empty" style="padding:24px 0">'+p[0]+'年'+Number(p[1])+'月还没有支出</div>';
  } else {
    const max = arr[0].v;
    $('#statBars').innerHTML = arr.map(function(o){
      const cat = EXP_CATS.filter(function(c){ return c.k === o.k; })[0];
      const pct = exp ? (o.v/exp*100) : 0;
      return '<div class="bar"><div class="barhd"><span>'+(cat?cat.e:'📦')+' '+esc(o.k)+'</span>'+
        '<span>¥'+fmt(o.v)+'　'+pct.toFixed(0)+'%</span></div>'+
        '<div class="track"><i style="width:'+Math.max(2, o.v/max*100)+'%"></i></div></div>';
    }).join('');
  }
  $('#statTip').innerHTML = noNote
    ? '本月有 <b>'+noNote+'</b> 笔支出还没写备注，去「明细 → 待补备注」补一下。'
    : '本月支出都写好备注了 👍';
}

/* ============ 更多 ============ */
function renderMore(){
  $('#cntEntries').textContent = entries.length;
  $('#cntRules').textContent = Object.keys(learned).length;
}
function download(name, text, mime){
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}
function exportJson(){
  const payload = {app:'随手记', version:1, exportedAt:new Date().toISOString(), entries:entries, learned:learned};
  download('ledger-backup-'+new Date().toISOString().slice(0,10)+'.json',
    JSON.stringify(payload, null, 2), 'application/json');
  toast('已导出备份');
}
function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportCsv(){
  const head = ['时间','类型','分类','商户','备注','金额(元)'];
  const rows = entries.slice().sort(function(a,b){ return a.time < b.time ? -1 : 1; }).map(function(e){
    const d = new Date(e.time);
    const t = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    return [t, e.type==='expense'?'支出':'收入', e.cat, e.merchant, e.note, (e.amt/100).toFixed(2)];
  });
  const csv = '\ufeff' + [head].concat(rows).map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  download('ledger-'+new Date().toISOString().slice(0,10)+'.csv', csv, 'text/csv;charset=utf-8');
  toast('已导出 CSV');
}
function importJson(file){
  const reader = new FileReader();
  reader.onload = function(){
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('文件读不出来，不是有效备份'); return; }
    const inc = (data && Array.isArray(data.entries)) ? data.entries : (Array.isArray(data) ? data : null);
    if(!inc){ toast('这不是本软件的备份文件'); return; }
    const have = {};
    entries.forEach(function(e){ have[e.id] = 1; });
    let added = 0;
    inc.forEach(function(e){
      if(e && e.id && !have[e.id] && typeof e.amt === 'number'){
        entries.push(e); have[e.id] = 1; added++;
      }
    });
    if(data.learned && typeof data.learned === 'object'){
      Object.keys(data.learned).forEach(function(k){ if(!learned[k]) learned[k] = data.learned[k]; });
      saveRules();
    }
    entries.sort(function(a,b){ return a.time < b.time ? 1 : -1; });
    saveData(); renderMore();
    toast(added ? '合并导入 '+added+' 笔' : '没有新记录');
  };
  reader.readAsText(file);
}

/* ============ 事件绑定 ============ */
function bind(){
  // 底部导航
  $$('nav button').forEach(function(b){
    b.onclick = function(){ switchView(b.dataset.v); };
  });

  // 支出/收入
  $$('#typeSeg button').forEach(function(b){
    b.onclick = function(){
      curType = b.dataset.t;
      $$('#typeSeg button').forEach(function(x){ x.classList.toggle('on', x===b); });
      curCat = '其他'; manualCat = false;
      renderCats(); setHint('');
      refreshMerchantHistory();
    };
  });

  // 分类点选
  $('#cats').addEventListener('click', function(ev){
    const b = ev.target.closest('button');
    if(!b) return;
    setCat(b.dataset.c);
    manualCat = true;
    setHint('');
  });

  // 商户变化 → 自动归类
  $('#merchant').addEventListener('input', recommendApply);
  $('#merchant').addEventListener('change', recommendApply);

  // 保存
  $('#saveBtn').onclick = saveEntry;
  $('#amt').addEventListener('keydown', function(ev){
    if(ev.key === 'Enter') saveEntry();
  });

  // 明细：月份
  $('#prevM').onclick = function(){ month = ymShift(month, -1); renderList(); };
  $('#nextM').onclick = function(){ month = ymShift(month, 1); renderList(); };

  // 明细：筛选
  $$('#filters button').forEach(function(b){
    b.onclick = function(){
      filter = b.dataset.f;
      $$('#filters button').forEach(function(x){ x.classList.toggle('on', x===b); });
      renderList();
    };
  });

  // 明细：点行编辑
  $('#listBody').addEventListener('click', function(ev){
    const row = ev.target.closest('.row');
    if(row) openEdit(row.dataset.id);
  });

  // 弹层关闭
  $('#mask').onclick = closeSheet;

  // 更多
  $('#expJson').onclick = exportJson;
  $('#expCsv').onclick = exportCsv;
  $('#impBtn').onclick = function(){ $('#impFile').click(); };
  $('#impFile').onchange = function(){
    if(this.files && this.files[0]) importJson(this.files[0]);
    this.value = '';
  };
  $('#clearBtn').onclick = function(){
    if(!confirm('确定清空全部记账数据？此操作不可撤销。')) return;
    if(!confirm('再确认一次：真的要清空吗？建议先导出备份。')) return;
    entries = []; saveData(); renderMore(); toast('已清空');
  };
  $('#clearRules').onclick = function(){
    if(!confirm('清除所有"商户→分类"记忆？')) return;
    learned = {}; saveRules(); renderMore(); toast('已清除');
  };
}

/* ============ 启动 ============ */
function boot(){
  load();
  bind();
  renderCats();
  resetAdd();
  renderList();
  $('#hdSub').textContent = entries.length
    ? '本月已记 ' + monthEntries().length + ' 笔'
    : '在手机上记下每一笔，自动归好类';
}
/* 仅 https 或本机地址下注册离线缓存（装到桌面后能断网用） */
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

boot();

})();
</script>
